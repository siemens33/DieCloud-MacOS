name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows executable & installer
        shell: pwsh
        run: |
          cd windows
          .\build.ps1
          cd ..
          mkdir release-win
          Copy-Item windows\build\DieCloud.exe release-win\DieCloud.exe
          if (Test-Path windows\build\xray.exe) { Copy-Item windows\build\xray.exe release-win\xray.exe }
          Compress-Archive -Path windows\build\* -DestinationPath release-win\DieCloud-Windows-Portable.zip -Force

          # Build Windows Installer (DieCloud-Setup.exe)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Compiling Windows installer with Inno Setup..."
            & $iscc windows\installer.iss
          } else {
            Write-Host "ISCC not found, installing Inno Setup via choco..."
            choco install innosetup -y
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss
          }

      - name: Upload binaries to Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "v5.0.1" }
          $files = @("release-win\DieCloud.exe", "release-win\DieCloud-Windows-Portable.zip")
          if (Test-Path release-win\DieCloud-Setup.exe) { $files += "release-win\DieCloud-Setup.exe" }
          if (Test-Path release-win\xray.exe) { $files += "release-win\xray.exe" }
          gh release upload $tag $files --clobber
